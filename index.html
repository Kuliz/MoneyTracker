<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Call-Out Tracker</title>
    <style>
        :root {
            --primary: #3498db;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #27ae60;
            --warning: #f1c40f;
            --danger: #e74c3c;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            padding: 15px; /* Reduced padding for mobile */
        }
        
        .header h1 { 
            font-size: 1.5rem; 
            margin-bottom: 20px; 
            text-align: center; 
        }
        
        /* Input Form */
        .form-container { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 30px; 
            border: 1px solid #334155; 
        }

        .form-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); 
            gap: 15px; 
        }
        
        .form-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; }
        
        input, select { 
            background: #0f172a; 
            border: 1px solid #475569; 
            color: white; 
            padding: 12px; 
            border-radius: 8px; 
            outline: none; 
            font-size: 16px; /* Prevents iOS auto-zoom on focus */
        }

        .add-btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 15px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%; /* Full width for easier tapping on mobile */
            margin-top: 20px;
        }

        /* Responsive Table Logic */
        .table-wrapper { border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; }
        
        /* Desktop Table Headers */
        thead { background: #334155; }
        th { padding: 15px; text-align: left; color: var(--text-dim); font-size: 0.75rem; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #334155; }

        /* Mobile View (Stacking rows into cards) */
        @media screen and (max-width: 768px) {
            thead { display: none; } /* Hide headers on mobile */
            
            tr { 
                display: block; 
                background: var(--card-bg); 
                margin-bottom: 15px; 
                border-radius: 12px; 
                padding: 10px;
                border: 1px solid #334155;
            }

            td { 
                display: flex; 
                justify-content: space-between; 
                align-items: center; 
                border: none; 
                padding: 8px 10px;
                text-align: right;
            }

            /* Add labels before data using data-attributes */
            td::before {
                content: attr(data-label);
                font-weight: bold;
                color: var(--text-dim);
                text-transform: uppercase;
                font-size: 0.7rem;
                text-align: left;
            }

            .delete-btn-cell {
                justify-content: center;
                border-top: 1px solid #334155;
                margin-top: 10px;
            }
        }
        
        /* Tags */
        .status-tag { padding: 4px 10px; border-radius: 6px; font-size: 0.7rem; font-weight: bold; }
        .pending { background: rgba(241, 196, 15, 0.2); color: var(--warning); border: 1px solid var(--warning); }
        .progress { background: rgba(52, 152, 219, 0.2); color: var(--primary); border: 1px solid var(--primary); }
        .review { background: rgba(155, 89, 182, 0.2); color: #9b59b6; border: 1px solid #9b59b6; }
        .completed { background: rgba(39, 174, 96, 0.2); color: var(--success); border: 1px solid var(--success); }
        .paid { color: var(--success); font-weight: bold; font-size: 0.8rem;}
        .unpaid { color: var(--danger); font-weight: bold; font-size: 0.8rem;}

        .delete-btn { color: var(--danger); background: none; border: 1px solid var(--danger); padding: 5px 15px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Vendor Call-Out Monitor</h1>
    </div>

    <div class="form-container">
        <div class="form-grid">
            <div class="form-group">
                <label>Call-Out Date</label>
                <input type="date" id="callDate">
            </div>
            <div class="form-group">
                <label>Vendor Name</label>
                <input type="text" id="vName" placeholder="Textile Hub">
            </div>
            <div class="form-group">
                <label>Work Description</label>
                <input type="text" id="wDesc" placeholder="50 Cargo Pants">
            </div>
            <div class="form-group">
                <label>Current Status</label>
                <select id="wStatus">
                    <option value="pending">Pending</option>
                    <option value="progress">In Progress</option>
                    <option value="review">Under Review</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
            <div class="form-group">
                <label>Due Date</label>
                <input type="date" id="wDue">
            </div>
            <div class="form-group">
                <label>Payment Status</label>
                <select id="pStatus">
                    <option value="unpaid">Unpaid</option>
                    <option value="paid">Paid</option>
                </select>
            </div>
        </div>
        <button class="add-btn" onclick="saveCallOut()">Create New Call-Out</button>
    </div>

    <div class="table-wrapper">
        <table id="vendorTable">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Vendor</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th>Due</th>
                    <th>Payment</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="work-table-body"></tbody>
        </table>
    </div>

    <script>
        let vendorData = JSON.parse(localStorage.getItem('vendorTrackerData')) || [];

        function saveCallOut() {
            const entry = {
                id: Date.now(),
                date: document.getElementById('callDate').value || 'N/A',
                vendor: document.getElementById('vName').value,
                desc: document.getElementById('wDesc').value,
                status: document.getElementById('wStatus').value,
                due: document.getElementById('wDue').value || 'N/A',
                payment: document.getElementById('pStatus').value
            };

            if(!entry.vendor || !entry.desc) {
                alert("Please fill in the Vendor and Description.");
                return;
            }

            vendorData.push(entry);
            localStorage.setItem('vendorTrackerData', JSON.stringify(vendorData));
            renderTable();
            
            document.getElementById('vName').value = '';
            document.getElementById('wDesc').value = '';
        }

        function renderTable() {
            const body = document.getElementById('work-table-body');
            body.innerHTML = vendorData.map(item => `
                <tr>
                    <td data-label="Date">${item.date}</td>
                    <td data-label="Vendor" style="font-weight: bold; color: var(--primary);">${item.vendor}</td>
                    <td data-label="Description">${item.desc}</td>
                    <td data-label="Status"><span class="status-tag ${item.status}">${item.status.replace('-', ' ')}</span></td>
                    <td data-label="Due Date">${item.due}</td>
                    <td data-label="Payment" class="${item.payment}">${item.payment.toUpperCase()}</td>
                    <td class="delete-btn-cell"><button class="delete-btn" onclick="removeEntry(${item.id})">Delete</button></td>
                </tr>
            `).join('');
        }

        function removeEntry(id) {
            if(confirm('Remove this entry?')) {
                vendorData = vendorData.filter(i => i.id !== id);
                localStorage.setItem('vendorTrackerData', JSON.stringify(vendorData));
                renderTable();
            }
        }

        renderTable();
    </script>
</body>
</html>
