<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZMW Income Tracker</title>
    <style>
        :root {
            --primary: #27ae60; /* Kwacha Green */
            --accent: #2ecc71;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); margin: 0; padding: 20px; }
        
        .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { background: var(--card-bg); border: 1px solid var(--text-dim); color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; display: none; }

        .year-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .month-card { background: var(--card-bg); padding: 20px; border-radius: 12px; cursor: pointer; transition: transform 0.2s, border 0.2s; border: 1px solid transparent; }
        .month-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .month-card h2 { margin: 0 0 10px 0; color: var(--accent); }
        .month-stat { font-size: 0.9rem; color: var(--text-dim); }
        .month-total { font-size: 1.5rem; font-weight: bold; margin-top: 10px; }

        #month-view { display: none; }
        .calendar-wrapper { background: var(--card-bg); border-radius: 16px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .grid { display: grid; grid-template-columns: repeat(7, 1fr) 130px; gap: 1px; background: #334155; border: 1px solid #334155; }
        .day-label, .cell { background: var(--card-bg); padding: 15px; }
        .day-label { font-weight: bold; text-align: center; color: var(--text-dim); font-size: 0.8rem; }
        
        .cell { min-height: 80px; position: relative; }
        .week-total-cell { background: #1e293b; color: var(--accent); font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; }
        
        .income-input { width: 100%; background: transparent; border: none; border-bottom: 1px solid #475569; color: var(--accent); font-size: 1.2rem; outline: none; margin-top: 5px; }
        .income-input:focus { border-color: var(--accent); }
        .date-num { font-size: 0.8rem; color: var(--text-dim); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <button id="back-to-year" class="back-btn" onclick="showYearView()">← Back to Year</button>
        <h1 id="view-title">2026 Financial Overview</h1>
        <div id="year-total-header">Yearly Total: <span id="grand-yearly-total" style="color: var(--accent)">ZMW 0</span></div>
    </div>

    <div id="year-view" class="year-grid"></div>

    <div id="month-view">
        <div class="calendar-wrapper">
            <div class="grid" id="calendar-grid">
                <div class="day-label">SUN</div><div class="day-label">MON</div><div class="day-label">TUE</div>
                <div class="day-label">WED</div><div class="day-label">THU</div><div class="day-label">FRI</div>
                <div class="day-label">SAT</div><div class="day-label">WEEKLY (ZMW)</div>
            </div>
        </div>
    </div>

    <script>
        const currency = "ZMW";
        const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        let financialData = JSON.parse(localStorage.getItem('incomeData')) || {};
        let currentMonthName = "";

        function initYearView() {
            const yearGrid = document.getElementById('year-view');
            yearGrid.innerHTML = '';
            let grandTotal = 0;

            months.forEach((month, index) => {
                const monthData = financialData[month] || {};
                const monthlyTotal = Object.values(monthData).reduce((a, b) => a + (parseFloat(b) || 0), 0);
                grandTotal += monthlyTotal;

                const card = document.createElement('div');
                card.className = 'month-card';
                card.onclick = () => showMonthView(index);
                card.innerHTML = `
                    <h2>${month}</h2>
                    <div class="month-stat">Total Income</div>
                    <div class="month-total">${currency} ${monthlyTotal.toLocaleString()}</div>
                `;
                yearGrid.appendChild(card);
            });

            document.getElementById('grand-yearly-total').innerText = `${currency} ${grandTotal.toLocaleString()}`;
        }

        function showMonthView(monthIndex) {
            currentMonthName = months[monthIndex];
            document.getElementById('year-view').classList.add('hidden');
            document.getElementById('month-view').style.display = 'block';
            document.getElementById('back-to-year').style.display = 'block';
            document.getElementById('view-title').innerText = `${currentMonthName} 2026`;
            renderCalendar(currentMonthName);
        }

        function showYearView() {
            document.getElementById('year-view').classList.remove('hidden');
            document.getElementById('month-view').style.display = 'none';
            document.getElementById('back-to-year').style.display = 'none';
            document.getElementById('view-title').innerText = "2026 Financial Overview";
            initYearView();
        }

        function renderCalendar(monthName) {
            const grid = document.getElementById('calendar-grid');
            const labels = grid.querySelectorAll('.day-label');
            grid.innerHTML = '';
            labels.forEach(l => grid.appendChild(l));

            const date = new Date(2026, months.indexOf(monthName), 1);
            const startDay = date.getDay();
            const daysInMonth = new Date(2026, months.indexOf(monthName) + 1, 0).getDate();

            let dayCounter = 1;
            for (let row = 0; row < 6; row++) {
                for (let col = 0; col < 7; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const index = row * 7 + col;

                    if (index >= startDay && dayCounter <= daysInMonth) {
                        const day = dayCounter;
                        const val = (financialData[monthName] && financialData[monthName][day]) || "";
                        cell.innerHTML = `
                            <div class="date-num">${day}</div>
                            <input type="number" class="income-input" placeholder="0" data-day="${day}" value="${val}">
                        `;
                        dayCounter++;
                    }
                    grid.appendChild(cell);
                }
                
                const wCell = document.createElement('div');
                wCell.className = 'cell week-total-cell';
                wCell.innerText = `${currency} 0`;
                grid.appendChild(wCell);

                if (dayCounter > daysInMonth && row >= 4) break; 
            }

            grid.querySelectorAll('.income-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    handleInput(monthName, e.target.dataset.day, e.target.value);
                });
            });

            refreshWeeklyTotals();
        }

        function handleInput(month, day, value) {
            if (!financialData[month]) financialData[month] = {};
            financialData[month][day] = value;
            localStorage.setItem('incomeData', JSON.stringify(financialData));
            refreshWeeklyTotals();
        }

        function refreshWeeklyTotals() {
            const allCells = Array.from(document.getElementById('calendar-grid').children).slice(8);
            let currentWeekSum = 0;

            for(let i=0; i < allCells.length; i++) {
                const cell = allCells[i];
                if ((i + 1) % 8 !== 0) {
                    const input = cell.querySelector('input');
                    if(input) currentWeekSum += parseFloat(input.value) || 0;
                } else {
                    cell.innerText = `${currency} ${currentWeekSum.toLocaleString()}`;
                    currentWeekSum = 0;
                }
            }
        }

        initYearView();
    </script>
</body>
</html>
