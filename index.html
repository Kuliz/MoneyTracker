<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Money Tracker</title>
    <style>
        :root {
            --primary: #00d1b2;
            --bg: #0b0f19;
            --card-bg: #161b2c;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --border: #2d3748;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            padding: 15px; 
        }

        /* Dashboard Switcher */
        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .role-toggle {
            display: flex;
            gap: 8px;
            background: #0b0f19;
            padding: 5px;
            border-radius: 8px;
        }

        .role-btn {
            padding: 6px 15px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: 0.2s;
            color: var(--text-dim);
            background: transparent;
        }

        .role-btn.active {
            background: var(--primary);
            color: #0b0f19;
        }

        /* Budget Meter Section */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .meter-label { font-size: 12px; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; display: block; }
        .meter-bg { width: 100%; height: 12px; background: #2d3748; border-radius: 10px; overflow: hidden; position: relative; cursor: help; }
        .meter-fill { height: 100%; width: 0%; transition: width 0.5s ease, background 0.5s; }

        /* Entry Form */
        .entry-form {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }

        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .input-group { display: flex; flex-direction: column; gap: 5px; }
        .input-group label { font-size: 11px; color: var(--text-dim); font-weight: bold; }
        
        input, select {
            background: #0b0f19;
            border: 1px solid var(--border);
            color: white;
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }

        .submit-btn {
            background: var(--primary);
            color: #0b0f19;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
        }

        /* Table */
        .table-container { background: var(--card-bg); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #1c253b; padding: 15px; text-align: left; font-size: 12px; color: var(--text-dim); text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 14px; }

        .editable:focus { background: #2d3748; outline: 1px solid var(--primary); border-radius: 4px; }
        .type-income { color: var(--success); font-weight: bold; }
        .type-expense { color: var(--danger); font-weight: bold; }

        .delete-btn { color: var(--danger); background: none; border: 1px solid var(--danger); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }

        /* Responsive Design */
        @media screen and (max-width: 768px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tr { border-bottom: 2px solid var(--border); padding: 10px; }
            td { display: flex; justify-content: space-between; align-items: center; border: none; padding: 8px 5px; }
            td::before { content: attr(data-label); font-weight: bold; color: var(--text-dim); font-size: 11px; }
        }
    </style>
</head>
<body>

    <div class="nav-container">
        <h2 style="margin:0; font-size: 18px;">MoneyTrack Pro</h2>
        <div class="role-toggle">
            <button class="role-btn active" id="admin-btn" onclick="switchRole('admin')">Admin</button>
            <button class="role-btn" id="guest-btn" onclick="switchRole('guest')">Guest</button>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <span class="meter-label">Total Balance</span>
            <div id="total-balance" style="font-size: 24px; font-weight: bold; color: var(--primary);">$0.00</div>
        </div>
        <div class="stat-card">
            <span class="meter-label" id="meter-text">Monthly Budget Exhaustion</span>
            <div class="meter-bg" id="budget-meter-container" data-tooltip="Loading...">
                <div class="meter-fill" id="budget-fill"></div>
            </div>
        </div>
    </div>

    <div class="entry-form" id="admin-inputs">
        <div class="input-grid">
            <div class="input-group">
                <label>Date</label>
                <input type="date" id="tx-date">
            </div>
            <div class="input-group">
                <label>Description</label>
                <input type="text" id="tx-desc" placeholder="Rent, Salary, etc.">
            </div>
            <div class="input-group">
                <label>Amount</label>
                <input type="number" id="tx-amount" placeholder="0.00">
            </div>
            <div class="input-group">
                <label>Type</label>
                <select id="tx-type">
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>
            </div>
        </div>
        <button class="submit-btn" onclick="addTransaction()">Commit Transaction</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th class="admin-action">Action</th>
                </tr>
            </thead>
            <tbody id="tx-body"></tbody>
        </table>
    </div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('moneyTrackerData')) || [];
        let currentRole = 'admin';
        const MONTHLY_BUDGET = 5000; // Set your monthly spending limit here

        function switchRole(role) {
            currentRole = role;
            document.getElementById('admin-btn').classList.toggle('active', role === 'admin');
            document.getElementById('guest-btn').classList.toggle('active', role === 'guest');
            document.getElementById('admin-inputs').style.display = role === 'admin' ? 'block' : 'none';
            renderUI();
        }

        function addTransaction() {
            const date = document.getElementById('tx-date').value || new Date().toISOString().split('T')[0];
            const desc = document.getElementById('tx-desc').value;
            const amount = parseFloat(document.getElementById('tx-amount').value);
            const type = document.getElementById('tx-type').value;

            if (!desc || isNaN(amount)) return alert("Please enter description and amount.");

            transactions.push({ id: Date.now(), date, desc, amount, type });
            saveAndRefresh();
            
            document.getElementById('tx-desc').value = '';
            document.getElementById('tx-amount').value = '';
        }

        function saveAndRefresh() {
            localStorage.setItem('moneyTrackerData', JSON.stringify(transactions));
            renderUI();
        }

        function handleEdit(id, field, newValue) {
            if (currentRole === 'guest') {
                alert("Permission Denied: Edit request for '" + field + "' sent to Admin dashboard for approval.");
                renderUI(); // Reset the UI
                return;
            }
            const idx = transactions.findIndex(t => t.id === id);
            if (field === 'amount') newValue = parseFloat(newValue) || 0;
            transactions[idx][field] = newValue;
            saveAndRefresh();
        }

        function deleteTx(id) {
            if (confirm("Delete this entry?")) {
                transactions = transactions.filter(t => t.id !== id);
                saveAndRefresh();
            }
        }

        function renderUI() {
            const body = document.getElementById('tx-body');
            let balance = 0;
            let totalExpenses = 0;

            body.innerHTML = transactions.map(tx => {
                if (tx.type === 'income') balance += tx.amount;
                else {
                    balance -= tx.amount;
                    totalExpenses += tx.amount;
                }

                const editable = currentRole === 'admin' ? 'contenteditable="true" class="editable"' : '';

                return `
                    <tr>
                        <td data-label="Date" ${editable} onblur="handleEdit(${tx.id}, 'date', this.innerText)">${tx.date}</td>
                        <td data-label="Description" ${editable} onblur="handleEdit(${tx.id}, 'desc', this.innerText)">${tx.desc}</td>
                        <td data-label="Type" class="type-${tx.type}">${tx.type.toUpperCase()}</td>
                        <td data-label="Amount" ${editable} onblur="handleEdit(${tx.id}, 'amount', this.innerText)">$${tx.amount.toFixed(2)}</td>
                        <td class="admin-action">
                            ${currentRole === 'admin' ? `<button class="delete-btn" onclick="deleteTx(${tx.id})">Delete</button>` : '-'}
                        </td>
                    </tr>
                `;
            }).join('');

            // Update Balance
            document.getElementById('total-balance').innerText = `$${balance.toLocaleString(undefined, {minimumFractionDigits: 2})}`;

            // Update Meter
            const percent = Math.min((totalExpenses / MONTHLY_BUDGET) * 100, 100);
            const fill = document.getElementById('budget-fill');
            const container = document.getElementById('budget-meter-container');
            
            fill.style.width = percent + '%';
            
            let color = 'var(--success)';
            let tip = 'Still have some time (Safe spending)';
            
            if (percent > 90) {
                color = 'var(--danger)';
                tip = 'Time is up act now (Budget Exceeded!)';
            } else if (percent > 60) {
                color = 'var(--warning)';
                tip = 'Youre running low on time (Spending warning)';
            }

            fill.style.background = color;
            container.setAttribute('data-tooltip', tip);

            // Toggle Action Column visibility
            document.querySelectorAll('.admin-action').forEach(el => {
                el.style.display = currentRole === 'admin' ? 'table-cell' : 'none';
            });
        }

        // Initialize
        renderUI();
    </script>
</body>
</html>
